name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COEUS_TEST_DATABASE_URL: postgresql+psycopg://coeus:coeus-test-only@127.0.0.1:5432/coeus_test
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0a07c4114ba6d1d04effcce3385e9f5ce305eb02e56a3d35948a415a52f193ec
        env:
          POSTGRES_DB: coeus_test
          POSTGRES_USER: coeus
          POSTGRES_PASSWORD: coeus-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coeus -d coeus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: File line limit
        working-directory: .
        run: node scripts/check-file-lines.mjs
      - name: Documentation links, images and anchors
        working-directory: .
        run: |
          node --test scripts/check-doc-links.test.mjs
          node scripts/check-doc-links.mjs
      - name: Install workspace dependencies and parse Mermaid diagrams
        working-directory: .
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm mermaid:check
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Architecture boundaries
        working-directory: .
        run: uv run --project apps/api python scripts/check_architecture.py
      - name: OpenAPI contract
        run: |
          uv run python ../../scripts/generate_openapi.py --check
          uv run python ../../scripts/check_openapi_compatibility.py --baseline-ref origin/main
      - name: Generated frontend API types
        working-directory: .
        run: |
          pnpm contracts:types
          git diff --exit-code -- apps/web/src/lib/api-client/generated/openapi.ts
      - name: PostgreSQL migration and concurrency harness
        run: >-
          uv run pytest -m postgres tests/postgres
          --cov-report= --cov-fail-under=0
      - name: Pytest with independent line and branch coverage gates
        run: |
          uv run pytest -m "not postgres" --cov-append --cov-report=json:coverage.json
          uv run python ../../scripts/check_backend_coverage.py coverage.json
      - name: Bandit
        run: uv run bandit -r src
      - name: pip-audit
        run: uv run pip-audit
